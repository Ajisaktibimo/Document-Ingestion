[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docai"
version = "0.1.0"
description = "Document-Grounded RAG System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "sentence-transformers[onnx]>=3.0",
    "transformers>=4.41,<4.56",
    "fastembed>=0.4",
    "qdrant-client>=1.12",
    "asyncpg",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "fastmcp>=0.1.0",
    "python-dotenv",
    "datasketch",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx",
    "ollama",
    "tiktoken",
    "python-docx",
    "falkordb>=1.0.1",
    "einops",
    "numpy",
    "python-multipart",
    "PyYAML"
]

[project.optional-dependencies]
paddle = [
    "paddleocr>=2.9",
    "paddlepaddle>=2.9"
]
paddle-gpu = [
    "paddleocr>=2.9",
    "paddlepaddle-gpu>=2.9"
]
marker = ["marker-pdf>=1.0"]
mineru = ["magic-pdf[full]>=0.6.0"]
docling = ["docling>=1.0.0"]
chandra = ["chandra-ocr[hf]"]
all = [
    "paddleocr>=2.9",
    "marker-pdf>=1.0",
    "magic-pdf[full]>=0.6.0",
    "docling>=1.0.0"
]

[project.scripts]
api = "docai.api.server:start"
mcp = "docai.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
